name: APP-009 Budget 360 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.0'
      - name: Initialize platform projects
        run: flutter create --platforms=android,ios --project-name butce_360 .
      - run: flutter pub get
      - name: Format Dart files
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze
      - name: Automated tests
        run: flutter test
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-009-budget360-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
